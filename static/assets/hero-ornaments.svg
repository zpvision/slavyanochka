      <g fill="none" stroke="#EAF3FF" stroke-linecap="round">
        <path d="M0 4C-10-17-19-32-20-55M1 0C4-21 9-35 10-59" opacity=".48"/>
        <path d="M-3-3C-20-21-28-30-29-46M5-8C19-28 25-37 28-46" opacity=".27"/>
      </g>
    </g>
    <g id="inner-petal">
