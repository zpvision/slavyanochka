    <use href="#bud" transform="translate(83 566) rotate(-38) scale(.65)"/>
    <use href="#bud" transform="translate(175 604) rotate(26) scale(.64)"/>
    <use href="#bud" transform="translate(716 527) rotate(23) scale(.85)"/>
    <use href="#bud" transform="translate(646 564) rotate(-26) scale(.72)"/>
    <use href="#flower" transform="translate(140 621) rotate(-19) scale(.72)"/>
    <use href="#flower" transform="translate(629 627) rotate(15) scale(.6)"/>
    <use href="#flower" transform="translate(692 614) rotate(-8) scale(1.06)"/>
