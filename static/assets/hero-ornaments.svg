<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 740">
  <!-- Original vector ornaments, inspired by the site's cobalt porcelain artwork.
       All symbols have transparent backgrounds and are independent of the photo. -->
  <defs>
    <linearGradient id="petal-blue" x1="0" y1="0" x2=".75" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#EAF3FF"/><stop offset=".28" stop-color="#8CB8EE"/><stop offset=".67" stop-color="#2867C5"/><stop offset="1" stop-color="#06358F"/>
    </linearGradient>
    <linearGradient id="petal-deep" x1="0" y1="0" x2="1" y2=".8">
      <stop stop-color="#D8EAFF"/><stop offset=".35" stop-color="#4C8ADA"/><stop offset=".7" stop-color="#0645B5"/><stop offset="1" stop-color="#06358F"/>
    </linearGradient>
    <linearGradient id="leaf-blue" x1="0" y1=".6" x2="1" y2=".3">
      <stop stop-color="#06358F"/><stop offset=".5" stop-color="#3676CB"/><stop offset="1" stop-color="#B5D5F8"/>
    </linearGradient>
    <linearGradient id="feather-blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#C5DFFF"/><stop offset=".42" stop-color="#4F8BDB"/><stop offset=".75" stop-color="#0645B5"/><stop offset="1" stop-color="#06358F"/>
    </linearGradient>
    <radialGradient id="flower-heart"><stop stop-color="#06358F"/><stop offset=".7" stop-color="#0645B5"/><stop offset="1" stop-color="#528DD9"/></radialGradient>
